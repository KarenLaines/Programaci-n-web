name: Deploy to AWS S3 (Assessment 1)

on:
  push:
    branches:
      - assessment-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: ./pokemon-gallery

      - name: Build project
        run: npm run build
        working-directory: ./pokemon-gallery

- name: Deploy to S3
  run: aws s3 sync ./pokemon-gallery/dist s3://$AWS_BUCKET --delete
  env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
    AWS_REGION: us-east-1

