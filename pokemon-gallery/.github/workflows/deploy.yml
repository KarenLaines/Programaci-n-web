name: Deploy Assessment-1

on:
  push:
    branches:
      - assessment-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Descargar el código
      - name: Checkout repo
        uses: actions/checkout@v3

      #  Configurar Node.js
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      #  Instalar dependencias
      - name: Install dependencies
        run: npm install

      #  Generar carpeta dist/ con Vite
      - name: Build project
        run: npm run build

      #  Configurar credenciales de AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Cambia por tu región de AWS

      # Subir dist/ a S3
      - name: Upload to S3
        uses: aws-actions/s3-sync@v2
        with:
          bucket: ${{ secrets.AWS_BUCKET }}
          source_dir: ./dist
          delete: true

      #Invalidar CloudFront para refrescar el CDN
      - name: Invalidate CloudFront
        uses: aws-actions/cloudfront-invalidate@v1
        with:
          distribution-id: ${{ secrets.CLOUDFRONT_ID }}
          paths: "/*"
